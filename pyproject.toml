[project]
name = "yahoo-mail-mcp"
dynamic = ["version"]
description = "MCP server for auditing and cleaning up Yahoo Mail accounts over IMAP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Khiet Tran" }]
keywords = ["mcp", "yahoo-mail", "imap", "email", "mailbox-cleanup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mcp>=1.28.1",
    "imapclient>=3.0.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.51.0",
    "starlette>=1.3.1",
]

[project.scripts]
yahoo-mail-mcp = "yahoo_mail_mcp.server:main"
yahoo-mail-mcp-http = "yahoo_mail_mcp.http:main"
yahoo-smtp-relay = "yahoo_mail_mcp.relay:main"

[project.urls]
Homepage = "https://github.com/ktrann24/yahoo-mail-mcp"
Repository = "https://github.com/ktrann24/yahoo-mail-mcp"
Issues = "https://github.com/ktrann24/yahoo-mail-mcp/issues"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8",
    "ruff>=0.15.21",
    "twine>=6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yahoo_mail_mcp"]

[tool.hatch.version]
path = "src/yahoo_mail_mcp/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

